name: Test Kernel Build For Pipa

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set branch environment variable
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install nano vim wget curl git ccache \
          automake flex lzop bison gperf build-essential zip \
          curl zlib1g-dev g++-multilib libxml2-utils bzip2 \
          libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools \
          pngcrush schedtool dpkg-dev liblz4-tool make optipng \
          maven libssl-dev pwgen libswitch-perl policycoreutils \
          minicom libxml-sax-base-perl libxml-simple-perl bc \
          libc6-dev-i386 lib32ncurses-dev libx11-dev lib32z-dev \
          libgl1-mesa-dev xsltproc unzip device-tree-compiler \
          cpio p7zip p7zip-full libtinfo6 -y

          sudo apt install python3 python-is-python3 -y

      - name: Install AOSP-Clang
        run: |
          mkdir -p ${{ github.workspace }}/clang
          wget -c --tries=10 --waitretry=5 --retry-on-host-error \
            -O clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/428d18d9732aa7ebfcaed87a582d86155db878d4/clang-r416183b.tar.gz"
          tar -xzf clang.tar.gz -C ${{ github.workspace }}/clang
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

      - name: Grant execute permission for build.sh
        run: chmod +x build.sh

      - name: Build Kernel (Test)
        run: ./build.sh

      - name: Notify Telegram on build success
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not configured, skipping notification."
            exit 0
          fi

          FULL_SHA="${{ github.sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"

          MESSAGE="<b>✅ Build succeeded</b>
          <a href=\"https://github.com/${{ github.repository }}\">Repository: ${{ github.repository }}</a>
          Branch: ${{ github.ref_name }}
          <a href=\"https://github.com/${{ github.repository }}/actions/workflows/TestKernelBuildForPipa.yml\">Workflow: ${{ github.workflow }}</a>
          <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Run: #${{ github.run_number }}</a>
          <a href=\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\">Commit: ${SHORT_SHA}...</a>"

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F document="@${ZIP_FILE}" \
              --form-string chat_id="${TELEGRAM_CHAT_ID}" \
              --form-string caption="${MESSAGE}" \
              --form-string "parse_mode=HTML"
          else
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "parse_mode=HTML"
          fi

      - name: Notify Telegram on build failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not configured, skipping notification."
            exit 0
          fi

          FULL_SHA="${{ github.sha }}"
          SHORT_SHA="${FULL_SHA:0:7}"

          MESSAGE="<b>❌ Build failed</b>
          <a href=\"https://github.com/${{ github.repository }}\">Repository: ${{ github.repository }}</a>
          Branch: ${{ github.ref_name }}
          <a href=\"https://github.com/${{ github.repository }}/actions/workflows/TestKernelBuildForPipa.yml\">Workflow: ${{ github.workflow }}</a>
          <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Run: #${{ github.run_number }}</a>
          <a href=\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\">Commit: ${SHORT_SHA}...</a>"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=HTML"

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v7
        with:
          name: Kernel-Pipa-Test-${{ github.ref_name }}-${{ github.run_number }}
          path: '*.zip'
          if-no-files-found: error

      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-error-log-${{ github.ref_name }}
          path: error.log
